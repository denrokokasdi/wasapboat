name: Release plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches tag
        run: |
          V=$(grep -m1 -oP 'Version:\s*\K\S+' wa-ai-chat/wa-ai-chat.php)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Plugin Version $V does not match tag $GITHUB_REF_NAME"; exit 1
          fi

      - name: Build zip
        run: zip -r wa-ai-chat.zip wa-ai-chat

      - name: Create release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" wa-ai-chat.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" wa-ai-chat.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
